<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QET Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif;background:#e9ecef;color:#222;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:4px;background:#1e5aa8;color:#fff;padding:4px 6px;height:48px;flex:none}
#top .ttl{flex:1;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 6px}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer}
#top button{width:40px;height:40px;font-size:20px;border-radius:8px}
#top button:active{background:rgba(255,255,255,.25)}
#pages{display:flex;gap:4px;overflow-x:auto;background:#d0d7de;padding:4px 6px;height:36px;flex:none;align-items:center}
#pages button{flex:none;padding:4px 12px;border-radius:14px;background:#fff;font-size:13px;color:#333}
#pages button.on{background:#1e5aa8;color:#fff}
#cvw{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:8px;right:8px;top:8px;background:rgba(30,30,30,.82);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;pointer-events:none;display:none;text-align:center}
#bar{display:flex;flex:none;overflow-x:auto;white-space:nowrap;background:#fff;border-top:1px solid #bbb;height:58px}
#bar button{flex:none;min-width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;color:#333;gap:1px}
#bar button span{font-size:10px;color:#555}
#bar button.on{background:#dbe8fb;color:#1e5aa8}
#bar button:disabled{opacity:.3}
#sheet{position:fixed;left:0;right:0;bottom:0;height:62%;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.35);display:none;flex-direction:column;z-index:20}
#sheet .hd{display:flex;gap:6px;padding:8px;align-items:center}
#sheet input{flex:1;padding:8px;font-size:15px;border:1px solid #bbb;border-radius:8px}
#sheet .grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:8px}
.item{border:1px solid #ccd;border-radius:8px;padding:4px;text-align:center;font-size:11px;background:#fafbfc}
.item canvas{width:80px;height:64px;display:block;margin:0 auto 2px}
.item div{height:28px;overflow:hidden}
#sheet .tabs{display:flex;gap:6px;padding:0 8px 6px;align-items:center;flex-wrap:wrap}
#sheet .tabs button{padding:6px 12px;border-radius:14px;background:#eee;font-size:13px;color:#333}
#sheet .tabs button.on{background:#1e5aa8;color:#fff}
#sheet select{margin:0 8px 6px;padding:6px;font-size:13px;border:1px solid #bbb;border-radius:8px;display:none}
#sheet .info{padding:0 10px 4px;font-size:12px;color:#555}
#menu{position:fixed;top:48px;right:6px;max-height:80vh;overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.35);display:none;z-index:30;min-width:200px;overflow-x:hidden}
#menu button{display:block;width:100%;text-align:right;padding:12px 16px;font-size:15px;color:#222;border-bottom:1px solid #eee}
#menu button:active{background:#eef}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50}
#dlg .box{background:#fff;border-radius:12px;padding:16px;width:92%;max-width:440px;max-height:90vh;overflow-y:auto}
#dlg h3{margin:0 0 10px;font-size:16px}
#dlg input{width:100%;padding:10px;font-size:16px;border:1px solid #aaa;border-radius:8px;user-select:text;-webkit-user-select:text}
#dlg .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-start}
#dlg .row button{padding:8px 18px;border-radius:8px;background:#eee;font-size:15px}
#dlg .row button#dlgOk{background:#1e5aa8;color:#fff}
#dlg textarea,#dlg select{width:100%;min-height:40px;padding:9px;border:1px solid #aaa;border-radius:7px;font:inherit;user-select:text}#dlg .row button{min-height:40px}
#icat,#isubcat{width:100%;margin:4px 0;padding:8px;border-radius:8px;background:var(--panel,#fff)} .moreParts{display:block;width:100%;margin:8px 0;padding:10px;border-radius:8px;border:1px solid #888;background:transparent;color:inherit}
</style>
</head>
<body>
<div id="top">
  <button id="bMenu" title="منو">☰</button>
  <div class="ttl" id="title">پروژه جدید</div>
  <button id="bOpen" title="باز کردن">📂</button>
  <button id="bSave" title="ذخیره">💾</button>
  <button id="bUndo" title="بازگشت">↶</button><button id="bRedo" title="انجام دوباره">↷</button>
  <button id="bFit" title="نمایش کامل">⤢</button>
</div>
<div id="pages"></div>
<div id="cvw"><canvas id="cv"></canvas><div id="hint"></div></div>
<div id="bar">
  <button id="tSelect" class="on">✋<span>انتخاب/حرکت</span></button>
  <button id="tWire">〰<span>سیم</span></button>
  <button id="tText">T<span>متن</span></button>
  <button id="tAdd">➕<span>قطعه</span></button>
  <button id="tRot">⟳<span>چرخش</span></button>
  <button id="tLbl">🏷<span>برچسب</span></button>
  <button id="tDel">🗑<span>حذف</span></button>
</div>
<div id="sheet">
  <div class="hd"><input id="q" placeholder="جستجوی قطعه..."><button id="sClose" style="font-size:22px;padding:4px 10px">✕</button></div>
  <div class="tabs"><button id="tabB" class="on">قطعات من</button><button id="tabL">کتابخانهٔ QET</button><button id="tabI">قطعات صنعتی</button><button id="bLibImp">⬇ فایل</button><button id="bLibDir">📁 پوشه</button></div>
  <select id="cat"></select><select id="icat" style="display:none"></select><select id="isubcat" style="display:none"></select><div class="info" id="info"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="menu"></div>
<div id="dlg"><div class="box"><h3 id="dlgT"></h3><input id="dlgI"><div class="row"><button id="dlgOk">تأیید</button><button id="dlgNo">لغو</button></div></div></div>
<input type="file" id="fileIn" accept=".qet,.xml,text/xml,application/xml" style="display:none"><input type="file" id="imageIn" accept="image/*" style="display:none">

<script>
'use strict';
/* ====================== helpers ====================== */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const uid = () => '{' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
}) + '}';
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d || 0); };
const ROT = (x, y, o) => o === 0 ? [x, y] : o === 1 ? [-y, x] : o === 2 ? [-x, -y] : [y, -x];
const DIR = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function ori(v) {
  if (v == null) return 0;
  if (/^-?\d+$/.test(String(v))) return ((parseInt(v, 10) % 4) + 4) % 4;
  return ({ n: 0, e: 1, s: 2, w: 3 })[String(v).toLowerCase()] || 0;
}
const kids = (el, tag) => el ? Array.from(el.children).filter(c => c.tagName === tag) : [];
const kid = (el, tag) => kids(el, tag)[0] || null;
const snap = v => { const g = (S.set && S.set.snap) || 10; return Math.round(v / g) * g; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const S = {
  title: 'پروژه جدید', fileName: 'project.qet', pages: [], cur: 0, defs: {}, builtin: {},
  view: { x: 30, y: 40, k: 0.6 }, tool: 'select', sel: null, wireFrom: null, undo: [], redo: [], n: 1, set:{snap:10,grid:false,textSize:12}, multi:[], clip:null, rawProps:'<properties/>', rawNewDiagrams:''
};
let DPR = window.devicePixelRatio || 1;
const page = () => S.pages[S.cur];

/* ====================== element definitions ====================== */
const WT = { none: 0, thin: 0.5, normal: 1, hight: 2, eleve: 5 };
const DASH = { dashed: [5, 3], dotted: [1.5, 3], dashdotted: [5, 3, 1.5, 3] };
function parseStyle(s) {
  const o = {};
  String(s || '').split(';').forEach(p => { const i = p.indexOf(':'); if (i > 0) o[p.slice(0, i).trim()] = p.slice(i + 1).trim(); });
  return o;
}
function parseFont(f, d) {
  if (!f) return d || 9;
  const n = parseFloat(String(f).split(',')[1]);
  return isFinite(n) && n > 0 ? n : (d || 9);
}

function parseDef(df, key) {
  const d = { key, name: key.split('/').pop().replace(/\.elmt$/, ''), shapes: [], terms: [], link: df.getAttribute('link_type') || 'simple', xml: new XMLSerializer().serializeToString(df) };
  const names = kid(df, 'names');
  if (names) {
    const ns = kids(names, 'name');
    const pick = ns.find(n => n.getAttribute('lang') === 'fa') || ns.find(n => n.getAttribute('lang') === 'en') || ns[0];
    if (pick && pick.textContent.trim()) d.name = pick.textContent.trim();
  }
  const desc = kid(df, 'description');
  if (desc) for (const c of Array.from(desc.children)) {
    const A = n => num(c.getAttribute(n));
    const st = parseStyle(c.getAttribute('style'));
    switch (c.tagName) {
      case 'line': d.shapes.push({ t: 'line', x1: A('x1'), y1: A('y1'), x2: A('x2'), y2: A('y2'), st }); break;
      case 'rect': d.shapes.push({ t: 'rect', x: A('x'), y: A('y'), w: A('width'), h: A('height'), st }); break;
      case 'ellipse': d.shapes.push({ t: 'ellipse', x: A('x'), y: A('y'), w: A('width'), h: A('height'), st }); break;
      case 'circle': d.shapes.push({ t: 'ellipse', x: A('x'), y: A('y'), w: A('diameter'), h: A('diameter'), st }); break;
      case 'arc': d.shapes.push({ t: 'arc', x: A('x'), y: A('y'), w: A('width'), h: A('height'), s: A('start'), a: A('angle'), st }); break;
      case 'polygon': {
        const pts = [];
        for (let i = 1; c.hasAttribute('x' + i); i++) pts.push([A('x' + i), A('y' + i)]);
        d.shapes.push({ t: 'poly', pts, closed: c.getAttribute('closed') !== 'false', st });
        break;
      }
      case 'text': d.shapes.push({ t: 'text', x: A('x'), y: A('y'), text: c.getAttribute('text') || '', size: c.hasAttribute('size') ? A('size') : parseFont(c.getAttribute('font'), 9), rot: A('rotation'), st, color: c.getAttribute('color') }); break;
      case 'terminal': d.terms.push({ x: A('x'), y: A('y'), o: ori(c.getAttribute('orientation')) }); break;
    }
  }
  d.bbox = bboxOf(d);
  return d;
}
function bboxOf(d) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  d.shapes.forEach(s => {
    if (s.t === 'line') { add(s.x1, s.y1); add(s.x2, s.y2); }
    else if (s.t === 'rect' || s.t === 'ellipse' || s.t === 'arc') { add(s.x, s.y); add(s.x + s.w, s.y + s.h); }
    else if (s.t === 'poly') s.pts.forEach(p => add(p[0], p[1]));
    else if (s.t === 'text') { add(s.x, s.y); add(s.x + s.text.length * s.size * 0.6, s.y + s.size * 1.2); }
  });
  d.terms.forEach(t => add(t.x, t.y));
  if (x0 > x1) return [-10, -10, 20, 20];
  return [x0, y0, x1 - x0, y1 - y0];
}
function col(n, def) { return n && /^[#a-zA-Z0-9(),. ]+$/.test(n) ? n : def; }

function drawShape(c, s) {
  const st = s.st || {};
  const lw = (st['line-weight'] in WT) ? WT[st['line-weight']] : 1;
  c.save();
  c.lineCap = 'butt';
  c.lineWidth = lw || 1;
  c.strokeStyle = 'black';
  c.strokeStyle = col(st.color, 'black');
  c.setLineDash(DASH[st['line-style']] || []);
  const filled = st.filling && st.filling !== 'none';
  c.fillStyle = 'rgba(0,0,0,.3)';
  if (filled) c.fillStyle = col(st.filling, 'rgba(0,0,0,.3)');
  if (s.t === 'text') {
    c.setLineDash([]);
    c.fillStyle = 'black';
    c.fillStyle = col(s.color, 'black');
    c.font = s.size + 'px sans-serif';
    c.textBaseline = 'top';
    c.textAlign = 'left';
    c.translate(s.x, s.y);
    if (s.rot) c.rotate(s.rot * Math.PI / 180);
    c.fillText(s.text, 0, 0);
    c.restore();
    return;
  }
  c.beginPath();
  if (s.t === 'line') { c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); }
  else if (s.t === 'rect') c.rect(s.x, s.y, s.w, s.h);
  else if (s.t === 'ellipse') c.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w / 2), Math.abs(s.h / 2), 0, 0, Math.PI * 2);
  else if (s.t === 'arc') {
    const r = Math.PI / 180;
    c.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w / 2), Math.abs(s.h / 2), 0, -s.s * r, -(s.s + s.a) * r, s.a > 0);
  } else if (s.t === 'poly') {
    s.pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
    if (s.closed) c.closePath();
  }
  if (filled && s.t !== 'line' && !(s.t === 'arc')) c.fill();
  if (lw > 0 || !filled) c.stroke();
  c.restore();
}

/* Built-in symbols (same XML format as QElectroTech element definitions) */
const BI = 'embed://import/qetmobile/';
const ST = 'line-style:normal;line-weight:normal;filling:none;color:black';
const STF = 'line-style:normal;line-weight:normal;filling:black;color:black';
const L = (a, b, c, d) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" style="${ST}" antialias="true"/>`;
const T = (x, y, o) => `<terminal x="${x}" y="${y}" orientation="${o}"/>`;
const R = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" style="${ST}" antialias="true"/>`;
const C = (x, y, d, f) => `<circle x="${x}" y="${y}" diameter="${d}" style="${f ? STF : ST}" antialias="true"/>`;
const TX = (x, y, t, s) => `<text x="${x}" y="${y}" text="${t}" font="Sans Serif,${s || 10},-1,5,50,0,0,0,0,0"/>`;
const V2 = (y1, y2) => L(0, -y1, 0, -y2) + L(0, y2, 0, y1) + T(0, -y1, 0) + T(0, y1, 2);
const BUILTINS = [
  ['resistor', 'مقاومت', 'Resistor', 20, 50, R(-5, -12, 10, 24) + V2(20, 12)],
  ['contact_no', 'کنتاکت باز (NO)', 'Contact NO', 30, 50, L(0, -20, 0, -8) + L(0, 20, 0, 8) + L(0, 8, -8, -6) + T(0, -20, 0) + T(0, 20, 2)],
  ['contact_nc', 'کنتاکت بسته (NC)', 'Contact NC', 30, 50, L(0, -20, 0, -8) + L(0, -8, -6, -8) + L(0, 20, 0, 8) + L(0, 8, -4, -8) + T(0, -20, 0) + T(0, 20, 2)],
  ['switch', 'کلید', 'Switch', 30, 50, L(0, -20, 0, -8) + L(0, 20, 0, 8) + L(0, 8, -8, -6) + C(-2, -10, 4, 1) + C(-2, 6, 4, 1) + T(0, -20, 0) + T(0, 20, 2)],
  ['lamp', 'لامپ', 'Lamp', 30, 50, C(-12, -12, 24) + L(-8.5, -8.5, 8.5, 8.5) + L(8.5, -8.5, -8.5, 8.5) + V2(20, 12)],
  ['motor', 'موتور', 'Motor', 40, 60, C(-15, -15, 30) + TX(-4, -7, 'M', 11) + V2(25, 15)],
  ['coil', 'کوئل / رله', 'Coil', 30, 50, R(-10, -7, 20, 14) + V2(17, 7)],
  ['fuse', 'فیوز', 'Fuse', 20, 50, R(-4, -10, 8, 20) + L(0, -10, 0, 10) + V2(20, 10)],
  ['capacitor', 'خازن', 'Capacitor', 30, 40, L(-10, -3, 10, -3) + L(-10, 3, 10, 3) + L(0, -15, 0, -3) + L(0, 3, 0, 15) + T(0, -15, 0) + T(0, 15, 2)],
  ['diode', 'دیود', 'Diode', 30, 50, `<polygon x1="-8" y1="-8" x2="8" y2="-8" x3="0" y3="6" closed="true" style="${STF}" antialias="true"/>` + L(-8, 6, 8, 6) + V2(20, 8)],
  ['battery', 'باتری / منبع DC', 'DC source', 30, 40, L(-10, -3, 10, -3) + L(-5, 3, 5, 3).replace('normal', 'hight') + L(0, -14, 0, -3) + L(0, 3, 0, 14) + T(0, -14, 0) + T(0, 14, 2)],
  ['ac_source', 'منبع AC', 'AC source', 40, 60, C(-15, -15, 30) + TX(-4, -7, '~', 12) + V2(25, 15)],
  ['voltmeter', 'ولت‌متر', 'Voltmeter', 30, 50, C(-12, -12, 24) + TX(-4, -7, 'V', 10) + V2(20, 12)],
  ['ammeter', 'آمپرمتر', 'Ammeter', 30, 50, C(-12, -12, 24) + TX(-4, -7, 'A', 10) + V2(20, 12)],
  ['terminal', 'ترمینال (بورن)', 'Terminal', 20, 40, C(-3, -3, 6) + L(0, -10, 0, -3) + L(0, 3, 0, 10) + T(0, -10, 0) + T(0, 10, 2)],
  ['ground', 'زمین', 'Ground', 30, 30, L(0, -10, 0, 0) + L(-10, 0, 10, 0) + L(-6, 4, 6, 4) + L(-2, 8, 2, 8) + T(0, -10, 0)],
  ['node', 'نقطهٔ اتصال', 'Junction', 20, 20, C(-2, -2, 4, 1) + T(0, 0, 0)]
];
function initBuiltins() {
  const P = new DOMParser();
  BUILTINS.forEach(b => {
    const [id, fa, en, w, h, body] = b;
    const xml = `<definition type="element" version="0.3" width="${w}" height="${h}" hotspot_x="${w / 2}" hotspot_y="${h / 2}"><names><name lang="en">${en}</name><name lang="fa">${fa}</name></names><description>${body}</description></definition>`;
    const doc = P.parseFromString(xml, 'application/xml');
    const d = parseDef(doc.documentElement, BI + id + '.elmt');
    d.builtin = true;
    S.defs[d.key] = d;
  });
}

/* ====================== project model ====================== */
const DEFC = { type: 'multi', condsize: '1', cable: '', bus: '', function: '', tension_protocol: '', conductor_color: '', conductor_section: '', text_color: '#000000', color2: '#000000', displaytext: '0', onetextperfolio: '0', 'vertical-alignment': 'AlignRight', 'horizontal-alignment': 'AlignBottom', horizrotatetext: '0', vertirotatetext: '0', formula: '', num: '', freezeLabel: 'false', 'dash-size': '1', bicolor: 'false', numsize: '9', x: '0', y: '0' };
function newPage(title) {
  return { title: title || 'صفحه ' + (S.pages.length + 1), cols: 17, rows: 8, colsize: 60, rowsize: 80, elements: [], conductors: [], texts: [], shapes: [], images: [], raw: [], attrs: {}, defcond:{}, maxT: 0 };
}
function newProject() {
  S.title = 'پروژه جدید'; S.fileName = 'project.qet';
  S.pages = [newPage('صفحه 1')]; S.cur = 0; S.sel = null; S.wireFrom = null; S.undo = []; S.redo=[]; S.rawProps='<properties/>'; S.rawNewDiagrams='';
  S.view = { x: 30, y: 40, k: 1.1 }; refresh();
}

function parseElement(x, p) {
  const e = { id: ++S.n, type: x.getAttribute('type') || '', x: num(x.getAttribute('x')), y: num(x.getAttribute('y')), z: num(x.getAttribute('z'), 10), o: ori(x.getAttribute('orientation')), uuid: x.getAttribute('uuid') || uid(), prefix: x.getAttribute('prefix') || '', terms: [], texts: [], info: {}, freezeLabel:x.getAttribute('freezeLabel')||'false', links:kids(kid(x,'links_uuids'),'link_uuid').map(n=>n.getAttribute('uuid')).filter(Boolean) };
  kids(kid(x, 'terminals'), 'terminal').forEach(t => {
    const id = parseInt(t.getAttribute('id'), 10);
    e.terms.push({ id, x: num(t.getAttribute('x')), y: num(t.getAttribute('y')), o: ori(t.getAttribute('orientation')), name: t.getAttribute('name') || '_', number: t.getAttribute('number') || '_' });
    if (id > p.maxT) p.maxT = id;
  });
  kids(kid(x, 'elementInformations'), 'elementInformation').forEach(i => { e.info[i.getAttribute('name')] = i.textContent; });
  kids(kid(x, 'dynamic_texts'), 'dynamic_elmt_text').forEach(d => {
    const tx = kid(d, 'text'), inf = kid(d, 'info_name');
    const from = d.getAttribute('text_from') || 'UserText';
    let text = tx ? tx.textContent : '';
    const info = inf ? inf.textContent : '';
    if (from === 'ElementInfo' && info && e.info[info] != null) text = e.info[info];
    e.texts.push({ x: num(d.getAttribute('x')), y: num(d.getAttribute('y')), text, size: parseFont(d.getAttribute('font'), 7), from, info, rotation:num(d.getAttribute('rotation')), uuid: d.getAttribute('uuid') || uid() });
  });
  return e;
}

function loadXml(text, name) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('فایل XML معتبر نیست');
  const root = doc.documentElement;
  if (root.tagName !== 'project') throw new Error('این فایل پروژهٔ QElectroTech (.qet) نیست');
  // embedded element collection -> library
  const walk = (node, path) => {
    Array.from(node.children).forEach(c => {
      if (c.tagName === 'category') walk(c, path.concat(c.getAttribute('name')));
      else if (c.tagName === 'element') {
        const df = kid(c, 'definition');
        if (df) { const key = 'embed://' + path.concat(c.getAttribute('name')).join('/'); S.defs[key] = parseDef(df, key); }
      }
    });
  };
  const colEl = kid(root, 'collection');
  if (colEl) walk(colEl, []);

  const pages = [];
  kids(root, 'diagram').forEach((d, i) => {
    const p = newPage(d.getAttribute('title') || 'صفحه ' + (i + 1));
    p.attrs = {};
    Array.from(d.attributes).forEach(a => { p.attrs[a.name] = a.value; });
    p.cols = num(p.attrs.cols, 17); p.rows = num(p.attrs.rows, 8);
    p.colsize = num(p.attrs.colsize, 60); p.rowsize = num(p.attrs.rowsize, 80);
    const dc=kid(d,'defaultconductor'); if(dc) Array.from(dc.attributes).forEach(a=>p.defcond[a.name]=a.value);
    const known=new Set(['defaultconductor','elements','conductors','inputs','shapes','images']);
    p.raw=Array.from(d.children).filter(n=>!known.has(n.tagName)).map(n=>new XMLSerializer().serializeToString(n));
    kids(kid(d, 'elements'), 'element').forEach(x => p.elements.push(parseElement(x, p)));
    kids(kid(d, 'conductors'), 'conductor').forEach(x => {
      const a = {}; Array.from(x.attributes).forEach(at => { a[at.name] = at.value; });
      const t1 = parseInt(a.terminal1, 10), t2 = parseInt(a.terminal2, 10);
      if (isFinite(t1) && isFinite(t2)) p.conductors.push({ id: ++S.n, t1, t2, attrs: a });
    });
    kids(kid(d,'shapes'),'shape').forEach(x=>{
      const ty=(x.getAttribute('type')||'Line').toLowerCase(), pn=kid(x,'pen'), br=kid(x,'brush'), pts=kid(x,'points');
      p.shapes.push({id:++S.n,t:ty==='rectangle'?'rect':ty==='polygon'?'poly':ty,x1:num(x.getAttribute('x1')),y1:num(x.getAttribute('y1')),x2:num(x.getAttribute('x2')),y2:num(x.getAttribute('y2')),pts:kids(pts,'point').map(q=>[num(q.getAttribute('x')),num(q.getAttribute('y'))]),closed:x.getAttribute('closed')==='true',rx:num(x.getAttribute('rx')),ry:num(x.getAttribute('ry')),color:pn?.getAttribute('color')||'#000000',w:num(pn?.getAttribute('widthF'),1),st:pn?.getAttribute('style')||'SolidLine',fill:br?.getAttribute('style')||'NoBrush',fc:br?.getAttribute('color')||'#ffffff',z:num(x.getAttribute('z')),movable:x.getAttribute('is_movable')!=='false'});
    });
    kids(kid(d,'images'),'image').forEach(x=>p.images.push({id:++S.n,x:num(x.getAttribute('x')),y:num(x.getAttribute('y')),z:num(x.getAttribute('z')),rot:num(x.getAttribute('rotation')),size:num(x.getAttribute('size'),1),data:x.textContent.trim()}));
    kids(kid(d, 'inputs'), 'input').forEach(x => {
      let t = x.getAttribute('text') || '';
      if (/<\s*(html|p|body)/i.test(t)) { const h = new DOMParser().parseFromString(t, 'text/html'); h.querySelectorAll('style,head').forEach(n => n.remove()); t = h.body.textContent.trim(); }
      p.texts.push({ id: ++S.n, x: num(x.getAttribute('x')), y: num(x.getAttribute('y')), text: t, size: parseFont(x.getAttribute('font'), 9) * 1.2, rot: num(x.getAttribute('rotation')) });
    });
    pages.push(p);
  });
  if (!pages.length) pages.push(newPage('صفحه 1'));
  S.title = root.getAttribute('title') || name.replace(/\.qet$/i, '');
  S.fileName = /\.qet$/i.test(name) ? name : name + '.qet';
  S.pages = pages; S.cur = 0; S.sel = null; S.wireFrom = null; S.undo = []; S.redo=[];
  const pr=kid(root,'properties'), nd=kid(root,'newdiagrams'); S.rawProps=pr?new XMLSerializer().serializeToString(pr):'<properties/>'; S.rawNewDiagrams=nd?new XMLSerializer().serializeToString(nd):'';
  saveLib();
}

      });
      x += '    </dynamic_texts>\n    <texts_groups/>\n' + (e.links&&e.links.length?'    <links_uuids>'+e.links.map(u=>'<link_uuid uuid=\"'+esc(u)+'\"/>').join('')+'</links_uuids>\n':'') + '   </element>\n';
    });
    x += '  </elements>\n  <conductors>\n';
    p.conductors.forEach(c => {
      const a2 = Object.assign({}, DEFC, c.attrs || {}, { terminal1: c.t1, terminal2: c.t2 });
      x += '   <conductor' + Object.keys(a2).map(k => ' ' + k + '="' + esc(a2[k]) + '"').join('') + '>\n    <sequentialNumbers/>\n   </conductor>\n';
    });
    x += '  </conductors>\n  <inputs>\n';
    p.texts.forEach(t => { x += '   <input x="' + t.x + '" y="' + t.y + '" rotation="' + (t.rot || 0) + '" font="Sans Serif,' + Math.max(1, Math.round(t.size / 1.2)) + ',-1,5,50,0,0,0,0,0,Normal" text="' + esc(t.text) + '"/>\n'; });
    x += '  </inputs>\n';
    if(p.shapes&&p.shapes.length){x+='  <shapes>\n';p.shapes.forEach(q=>{const ty=q.t==='rect'?'Rectangle':q.t==='ellipse'?'Ellipse':q.t==='poly'?'Polygon':'Line';x+='   <shape type="'+ty+'" is_movable="'+(q.movable===false?'false':'true')+'" closed="'+(q.closed?'true':'false')+'" x1="'+q.x1+'" y1="'+q.y1+'" x2="'+q.x2+'" y2="'+q.y2+'" rx="'+(q.rx||0)+'" ry="'+(q.ry||0)+'" z="'+(q.z||0)+'"><pen style="'+esc(q.st||'SolidLine')+'" color="'+esc(q.color||'#000000')+'" widthF="'+(q.w||1)+'"/><brush style="'+esc(q.fill||'NoBrush')+'" color="'+esc(q.fc||'#ffffff')+'"/>'+(q.t==='poly'?'<points>'+q.pts.map(v=>'<point x="'+v[0]+'" y="'+v[1]+'"/>').join('')+'</points>':'')+'</shape>\n';});x+='  </shapes>\n';}
    if(p.images&&p.images.length){x+='  <images>\n';p.images.forEach(im=>x+='   <image x="'+im.x+'" y="'+im.y+'" z="'+(im.z||0)+'" rotation="'+(im.rot||0)+'" size="'+(im.size||1)+'" is_movable="1">'+im.data+'</image>\n');x+='  </images>\n';}
    (p.raw||[]).forEach(raw=>{x+='  '+raw+'\n';}); x += ' </diagram>\n';
  });
  // collection with the definitions that are used
  const tree = { c: {}, e: [] };
  used.forEach(key => {
    const d = S.defs[key]; if (!d || key.indexOf('embed://') !== 0) return;
    const parts = key.slice(8).split('/'); let n = tree;
    for (let i = 0; i < parts.length - 1; i++) { n.c[parts[i]] = n.c[parts[i]] || { c: {}, e: [] }; n = n.c[parts[i]]; }
    n.e.push({ name: parts[parts.length - 1], xml: d.xml });
  });
  const ser = (n, ind) => {
    let s = '';
    Object.keys(n.c).forEach(k => { s += ind + '<category name="' + esc(k) + '">\n' + ind + ' <names><name lang="en">' + esc(k) + '</name></names>\n' + ser(n.c[k], ind + ' ') + ind + '</category>\n'; });
    n.e.forEach(e => { s += ind + '<element name="' + esc(e.name) + '">\n' + e.xml + '\n' + ind + '</element>\n'; });
    return s;
  };
  x += ' <collection>\n' + ser(tree, '  ') + ' </collection>\n</project>\n';
  return x;
}

/* library persistence */
function saveLib() {
  try {
    const o = {}; Object.keys(S.defs).forEach(k => { if (!S.defs[k].builtin && !S.defs[k].lib) o[k] = S.defs[k].xml; });
    localStorage.setItem('qet_lib', JSON.stringify(o));
  } catch (e) { /* storage full: ignore */ }
}
function loadLib() {
  try {
    const o = JSON.parse(localStorage.getItem('qet_lib') || '{}'); const P = new DOMParser();
    Object.keys(o).forEach(k => { const doc = P.parseFromString(o[k], 'application/xml'); if (!doc.querySelector('parsererror')) S.defs[k] = parseDef(doc.documentElement, k); });
  } catch (e) { /* ignore */ }
}
let autoT = null;
function autosave() {
  clearTimeout(autoT);
  autoT = setTimeout(() => { try { localStorage.setItem('qet_auto', buildXml()); localStorage.setItem('qet_auto_name', S.fileName); } catch (e) { /* ignore */ } }, 600);
}

/* ====================== geometry ====================== */
function buildTM(p) {
  const m = new Map();
  p.elements.forEach(e => e.terms.forEach(t => {
    const r = ROT(t.x, t.y, e.o);
    m.set(t.id, { x: e.x + r[0], y: e.y + r[1], dir: (t.o + e.o) % 4, el: e });
  }));
  p._tm = m;
  return m;
}
function condPts(p, c) {
  const m = p._tm || buildTM(p);
  const a = m.get(c.t1), b = m.get(c.t2);
  if (!a || !b) return null;
  const da = DIR[a.dir], db = DIR[b.dir], Ln = 12;
  const a1 = { x: a.x + da[0] * Ln, y: a.y + da[1] * Ln }, b1 = { x: b.x + db[0] * Ln, y: b.y + db[1] * Ln };
  const pts = [[a.x, a.y], [a1.x, a1.y]];
  const ah = da[1] === 0, bh = db[1] === 0;
  if (ah && bh) { const mx = (a1.x + b1.x) / 2; pts.push([mx, a1.y], [mx, b1.y]); }
  else if (!ah && !bh) { const my = (a1.y + b1.y) / 2; pts.push([a1.x, my], [b1.x, my]); }
  else if (ah && !bh) pts.push([b1.x, a1.y]);
  else pts.push([a1.x, b1.y]);
  pts.push([b1.x, b1.y], [b.x, b.y]);
  return pts;
}
function elBox(e) { const d = S.defs[e.type]; return d ? d.bbox : [-20, -12, 40, 24]; }

/* ====================== rendering ====================== */
function drawTextAt(c, x, y, text, size, color) {

  const lines = String(text).split('\n'); let w = 0;
  lines.forEach((ln, i) => { c.fillText(ln, x, y + i * size * 1.2); w = Math.max(w, c.measureText(ln).width); });
  c.restore();

}

function render() {
  if (!S.pages.length) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#e9ecef'; ctx.fillRect(0, 0, cv.width, cv.height);
  const v = S.view;
  ctx.setTransform(DPR * v.k, 0, 0, DPR * v.k, DPR * v.x, DPR * v.y);
  drawPage(ctx, page(), true);
}
function resize() {
  DPR = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(r.width * DPR)); cv.height = Math.max(1, Math.round(r.height * DPR));
  render();
}
function fit() {
  const p = page(); if (!p) return;
  const r = cv.getBoundingClientRect(); if (!r.width) { S.view = { x: 20, y: 20, k: 0.5 }; return; }
  const W = p.cols * p.colsize + 60, H = p.rows * p.rowsize + 90;
  const k = Math.min(r.width / W, r.height / H);
  S.view = { k, x: (r.width - (W - 60) * k) / 2, y: (r.height - (H - 90) * k) / 2 };
}
const toWorld = (sx, sy) => ({ x: (sx - S.view.x) / S.view.k, y: (sy - S.view.y) / S.view.k });

/* ====================== hit testing ====================== */
function hitAnyBase(w) {
  const p = page(), k = S.view.k;
  for (let i = p.texts.length - 1; i >= 0; i--) {
    const t = p.texts[i];
    if (w.x >= t.x - 3 && w.x <= t.x + (t._w || 30) + 3 && w.y >= t.y - 3 && w.y <= t.y + (t._h || t.size) + 3) return { k: 'tx', o: t };
  }
  for (let i = p.elements.length - 1; i >= 0; i--) {
    const e = p.elements[i], r = ROT(w.x - e.x, w.y - e.y, (4 - e.o) % 4), b = elBox(e), m = 4 / k;
    if (r[0] >= b[0] - m && r[0] <= b[0] + b[2] + m && r[1] >= b[1] - m && r[1] <= b[1] + b[3] + m) return { k: 'el', o: e };
  }
  for (let i = p.conductors.length - 1; i >= 0; i--) {
    const pts = condPts(p, p.conductors[i]); if (!pts) continue;
    for (let j = 0; j < pts.length - 1; j++) if (distSeg(w, pts[j], pts[j + 1]) < 8 / k) return { k: 'co', o: p.conductors[i] };
  }

function loadIndustrialCategory(code, done) {

function industrialXml(r) {
  const [id,fa,en,cat,sub,maker,ref,rating,voltage,poles,symbol,termCount,spec] = r;
  const w=60,h=60, cx=30,cy=30, lines=[];
  const style='line-style:normal;line-weight:thin;filling:none;color:black';
  if (symbol==='motor' || symbol==='sensor' || symbol==='meter' || symbol==='valve') {
    lines.push('<circle x="18" y="18" diameter="24" style="'+style+'"/>');
    lines.push('<text x="25" y="34" text="'+(symbol==='motor'?'M':symbol==='meter'?'M':symbol==='valve'?'V':'S')+'" size="10" style="'+style+'"/>');
  } else if (symbol==='electronic') {
    lines.push('<rect x="16" y="18" width="28" height="24" style="'+style+'"/>');
    lines.push('<line x1="20" y1="30" x2="40" y2="30" style="'+style+'"/>');
  } else if (symbol==='transformer') {
    lines.push('<circle x="20" y="20" diameter="18" style="'+style+'"/><circle x="22" y="22" diameter="18" style="'+style+'"/>');
  } else {
    lines.push('<rect x="18" y="18" width="24" height="24" style="'+style+'"/>');
    lines.push('<line x1="22" y1="30" x2="38" y2="30" style="'+style+'"/>');
  }
  const n=Math.max(2,Math.min(12,+termCount||2));
  for(let i=0;i<n;i++){
    const left=i<n/2, idx=left?i: i-Math.ceil(n/2), sideCount=left?Math.ceil(n/2):Math.floor(n/2);
    const y= Math.round(8+(idx+1)*(44/(sideCount+1)));
    lines.push('<terminal x="'+(left?0:60)+'" y="'+y+'" orientation="'+(left?0:2)+'"/>');
    lines.push('<line x1="'+(left?0:60)+'" y1="'+y+'" x2="'+(left?18:42)+'" y2="'+y+'" style="'+style+'"/>');
  }
  return '<definition type="element" version="0.3" width="'+w+'" height="'+h+'" hotspot_x="30" hotspot_y="30"><names><name lang="en">'+esc(en)+'</name><name lang="fa">'+esc(fa)+'</name></names><description>'+lines.join('')+'</description></definition>';
}
function addIndustrialRecord(r) {

    e.info=Object.assign({},e.info,{

function buildIndustrialGrid(g,q) {
  const sel=$('icat'), subSel=$('isubcat');
  if(!sel.options.length){
    INDUSTRIAL_CATS.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[1];sel.appendChild(o);});
  }
  const code=sel.value||'01'; sel.value=code;
  loadIndustrialCategory(code,()=>{
    if(S.lib.tab!=='industrial' || $('icat').value!==code)return;
    const rows=(window.QET_PARTS&&window.QET_PARTS[code])||[];
    const subs=Array.from(new Set(rows.map(r=>r[4]))).sort((a,b)=>a.localeCompare(b));
    const previous=subSel.value;
    subSel.innerHTML='';
    const all=document.createElement('option');all.value='';all.textContent='همهٔ زیردسته‌ها';subSel.appendChild(all);
    subs.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;subSel.appendChild(o);});
    if(subs.includes(previous))subSel.value=previous;
    const sub=subSel.value;
    const query=(q||'').toLocaleLowerCase();
    const matches=rows.filter(r=>(!sub||r[4]===sub)&&(!query||r.join(' ').toLocaleLowerCase().includes(query)));
    $('info').textContent=matches.length+' نتیجه؛ '+rows.length+' قطعه در دسته، '+subs.length+' زیردسته';
    const start=industrialPage*60, shown=matches.slice(start,start+60);
    shown.forEach(r=>{
      const key='industrial/'+r[0]+'.elmt';
      let d=S.defs[key];
      if(!d){const doc=new DOMParser().parseFromString(industrialXml(r),'application/xml');if(doc.querySelector('parsererror'))return;d=parseDef(doc.documentElement,key);S.defs[key]=d;}
      addItem(g,d,r[1]+' · '+r[5]+' / '+r[6],()=>addIndustrialRecord(r));
    });
    if(start+60<matches.length){const b=document.createElement('button');b.className='moreParts';b.textContent='نمایش ۶۰ قطعهٔ بعدی';b.onclick=()=>{industrialPage++;g.innerHTML='';buildIndustrialGrid(g,q);};g.appendChild(b);}
    if(!matches.length)g.textContent='قطعه‌ای پیدا نشد';
  });
}

function drawPreview(c, d) {

function decodeB64(b) { const bin = atob(b), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new TextDecoder('utf-8').decode(a); }

function saveOut(name, mime, b64) {
  if (window.Android && Android.saveFile) Android.saveFile(name, mime, b64);
  else { const a = document.createElement('a'); a.href = 'data:' + mime + ';base64,' + b64; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
}

}

function elementXmlFromForm(v){

}
async function createCustomElement(){
  const v=await form('طراحی قطعهٔ سفارشی',[{k:'name',l:'نام فارسی',v:'قطعه سفارشی'},{k:'en',l:'نام انگلیسی',v:'Custom element'},{k:'width',l:'عرض (واحد QET)',t:'num',v:40},{k:'height',l:'ارتفاع (واحد QET)',t:'num',v:50},{k:'primitives',l:'شکل‌ها (هر خط: نوع و مختصات)',t:'area',v:'line -20 0 20 0\nrect -10 -10 20 20\ncircle -3 -3 6'},{k:'terminals',l:'ترمینال‌ها (هر خط: x y جهت؛ جهت ۰ شمال، ۱ شرق، ۲ جنوب، ۳ غرب)',t:'area',v:'0 -25 0\n0 25 2'}]);
  if(!v)return;
  const xml=elementXmlFromForm(v),doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.querySelector('parsererror'))return toast('تعریف قطعه معتبر نیست');
  const key='user://custom/'+Date.now()+'.elmt',d=parseDef(doc.documentElement,key);d.xml=xml;d.custom=true;S.defs[key]=d;saveLib();
  const blob=new Blob([xml],{type:'application/xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(v.name||'custom-element').replace(/[^\w\u0600-\u06FF-]+/g,'_')+'.elmt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('قطعه به کتابخانه اضافه شد؛ فایل ELMT نیز صادر شد');openSheet();
}
function exportSelectedElement(){if(!S.sel||S.sel.k!=='el')return toast('ابتدا یک قطعه انتخاب کنید');const d=S.defs[S.sel.o.type];if(!d||!d.xml)return toast('تعریف XML قطعه در دسترس نیست');const blob=new Blob([d.xml],{type:'application/xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(d.name||'element').replace(/[^\w\u0600-\u06FF-]+/g,'_')+'.elmt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function addStage4Menu(){const m=$('menu');const add=(label,fn)=>{if(Array.from(m.querySelectorAll('button')).some(b=>b.textContent===label))return;const b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.style.display='none';fn();};m.appendChild(b);};add('طراحی قطعه سفارشی',createCustomElement);add('خروجی ELMT قطعه انتخابی',exportSelectedElement);}

function addStage3Menu(){const m=$('menu');const add=(label,fn)=>{if(Array.from(m.querySelectorAll('button')).some(b=>b.textContent===label))return;const b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.style.display='none';fn();};m.appendChild(b);};add('فهرست صفحات',folioList);add('کپی صفحه فعلی',pageCopy);add('خروجی BOM / نومنکلاتور',exportBom);add('خروجی لیست سیم‌ها',exportWireList);add('جستجو و جایگزینی',searchReplace);add('خروجی PNG همه صفحات',exportPngAll);add('خروجی SVG صفحه فعلی',exportSvg);add('خروجی DXF صفحه فعلی',exportDxf);add('خروجی PDF',exportPdf);add('بزرگ‌نمایی +',()=>zoomAt(1.2));add('کوچک‌نمایی −',()=>zoomAt(1/1.2));add('زوم روی انتخاب',zoomSelection);}
const openMenuStage2=openMenu;openMenu=function(){openMenuStage2();if($('menu').style.display==='block'){addStage3Menu();addStage4Menu();}};
function addStage3TopButtons(){[['bZoomIn','＋',()=>zoomAt(1.2)],['bZoomOut','−',()=>zoomAt(1/1.2)]].forEach(([id,t,fn])=>{if($(id))return;const b=document.createElement('button');b.id=id;b.textContent=t;b.title=t==='＋'?'بزرگ‌نمایی':'کوچک‌نمایی';b.onclick=fn;$('top').insertBefore(b,$('bFit'));});}
addStage3TopButtons();


/* ====================== stage 5: ELMT import and custom library manager ====================== */
function safeElementFileName(s){
  return String(s||'element').trim().replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,80)||'element';
}
function downloadTextFile(name, text, mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function importElementFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onerror=()=>toast('خواندن فایل ناموفق بود');
  reader.onload=()=>{
    try{
      const xml=String(reader.result||''),doc=new DOMParser().parseFromString(xml,'application/xml');
      const root=doc.documentElement;
      if(doc.querySelector('parsererror')||!root||root.tagName!=='definition'||root.getAttribute('type')!=='element'){
        toast('فایل ELMT معتبر نیست');return;
      }
      const serialized=new XMLSerializer().serializeToString(root);
      const parsed=parseDef(root,'user://imported/'+Date.now()+'.elmt');
      if(!parsed.shapes.length&&!parsed.terms.length){toast('این قطعه شکل یا ترمینال قابل‌نمایشی ندارد');return;}
      const key='user://imported/'+safeElementFileName(parsed.name)+'-'+Date.now()+'.elmt';
      parsed.key=key;parsed.xml=serialized;parsed.custom=true;parsed.builtin=false;parsed.lib=false;
      S.defs[key]=parsed;saveLib();toast('قطعه وارد کتابخانه شد');openSheet();
    }catch(e){toast('خطا در واردکردن قطعه: '+(e&&e.message?e.message:'نامشخص'));}
  };
  reader.readAsText(file);
}
function chooseElementImport(){
  const input=document.createElement('input');input.type='file';input.accept='.elmt,.xml,application/xml,text/xml';
  input.onchange=()=>{if(input.files&&input.files[0])importElementFile(input.files[0]);};
  input.click();
}
function customElementKeys(){
  return Object.keys(S.defs).filter(k=>k.indexOf('user://')===0&&S.defs[k]&&!S.defs[k].builtin&&!S.defs[k].lib);
}
function exportCustomLibraryBackup(){
  const keys=customElementKeys(),backup={format:'qet-mobile-custom-library',version:1,elements:{}};
  keys.forEach(k=>{const d=S.defs[k];if(d&&d.xml)backup.elements[k]=d.xml;});
  downloadTextFile('qet-mobile-custom-elements.json',JSON.stringify(backup,null,2),'application/json;charset=utf-8');
  toast(keys.length+' قطعه در فایل پشتیبان قرار گرفت');
}
function importCustomLibraryBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onerror=()=>toast('خواندن فایل پشتیبان ناموفق بود');
  reader.onload=()=>{
    try{
      const data=JSON.parse(String(reader.result||'{}'));
      if(data.format!=='qet-mobile-custom-library'||!data.elements||typeof data.elements!=='object')throw new Error('ساختار فایل پشتیبان شناخته‌شده نیست');
      const parser=new DOMParser();let added=0;
      Object.keys(data.elements).forEach(oldKey=>{
        const doc=parser.parseFromString(String(data.elements[oldKey]||''),'application/xml'),root=doc.documentElement;
        if(doc.querySelector('parsererror')||!root||root.tagName!=='definition'||root.getAttribute('type')!=='element')return;
        const d=parseDef(root,'user://backup/'+Date.now()+'-'+added+'.elmt');
        d.key='user://backup/'+safeElementFileName(d.name)+'-'+Date.now()+'-'+added+'.elmt';
        d.xml=new XMLSerializer().serializeToString(root);d.custom=true;d.builtin=false;d.lib=false;
        S.defs[d.key]=d;added++;
      });
      saveLib();toast(added+' قطعه از پشتیبان بازیابی شد');openSheet();
    }catch(e){toast('فایل پشتیبان معتبر نیست: '+(e&&e.message?e.message:''));}
  };
  reader.readAsText(file);
}
function chooseLibraryBackupImport(){
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=()=>{if(input.files&&input.files[0])importCustomLibraryBackup(input.files[0]);};input.click();
}
async function removeCustomElement(key){
  const d=S.defs[key];if(!d||key.indexOf('user://')!==0)return;
  const note=document.createElement('p');note.textContent='قطعه «'+d.name+'» از کتابخانه سفارشی حذف شود؟';
  const yes=await popup('تأیید حذف',note,[{label:'حذف',value:true},{label:'انصراف',value:false}]);
  if(!yes)return;
  delete S.defs[key];saveLib();toast('قطعه حذف شد');manageCustomElements();
}
function manageCustomElements(){
  const keys=customElementKeys().sort((a,b)=>S.defs[a].name.localeCompare(S.defs[b].name));
  const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:8px';
  if(!keys.length){const p=document.createElement('p');p.textContent='هنوز قطعه سفارشی ذخیره نشده است.';wrap.appendChild(p);}
  keys.forEach(key=>{
    const d=S.defs[key],row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:6px;padding:7px;border:1px solid #ddd;border-radius:8px';
    const name=document.createElement('span');name.textContent=d.name;name.style.cssText='flex:1;min-width:0;overflow-wrap:anywhere';
    const exp=document.createElement('button');exp.textContent='خروجی';exp.onclick=()=>downloadTextFile(safeElementFileName(d.name)+'.elmt',d.xml,'application/xml;charset=utf-8');
    const del=document.createElement('button');del.textContent='حذف';del.onclick=()=>{$('dlg').style.display='none';removeCustomElement(key);};
    row.append(name,exp,del);wrap.appendChild(row);
  });
  popup('مدیریت کتابخانه قطعات سفارشی',wrap,[{label:'بستن',value:null}]);
}
function addStage5Menu(){
  const m=$('menu');
  const add=(label,fn)=>{
    if(Array.from(m.querySelectorAll('button')).some(b=>b.textContent===label))return;
    const b=document.createElement('button');b.textContent=label;
    b.onclick=()=>{m.style.display='none';fn();};m.appendChild(b);
  };
  add('واردکردن فایل ELMT',chooseElementImport);
  add('مدیریت قطعات سفارشی',manageCustomElements);
  add('پشتیبان‌گیری از کتابخانه قطعات',exportCustomLibraryBackup);
  add('بازیابی پشتیبان کتابخانه',chooseLibraryBackupImport);
}
const openMenuStage4=openMenu;
openMenu=function(){
  openMenuStage4();
  if($('menu').style.display==='block')addStage5Menu();
};
/* ====================== end stage 5 ====================== */
